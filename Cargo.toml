[package]
name = "git-ws"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.29"
lexopt = "0.3"
nucleo-matcher = "0.3"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
insta = "1"
tempfile = "3"

[[bin]]
name = "git-ws"
path = "src/main.rs"
