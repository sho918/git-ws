name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RUST_VERSION: "1.95.0"

jobs:
  verify:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt clippy

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo +"$RUST_VERSION" fmt --check

      - name: Lint
        run: cargo +"$RUST_VERSION" clippy --all-targets -- -D warnings

      - name: Test
        run: cargo +"$RUST_VERSION" test --locked

      - name: Build
        run: cargo +"$RUST_VERSION" build --locked
